[project]
name = "private-usage-demo"
version = "0.1.0"
description = "Signed usage collection, OTel export, and private SQL receipt demo"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "httpx>=0.28,<1",
  "cryptography>=44,<49",
  "duckdb>=1.2,<2",
  "qrcode>=8,<9",
  "tinfoil>=0.14,<0.15",
  "python-dotenv>=1,<2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "opentelemetry-instrumentation-fastapi>=0.51b0,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["usage_demo"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
